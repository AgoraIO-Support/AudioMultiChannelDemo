server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # HTML 入口始终不缓存，确保新版本能立即下发
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Vite 构建出的带 hash 资源（JS/CSS，如 index-B-3pcp-h.js：
    # 连字符分隔、base64url 字符集）可长期缓存
    location ~* -[A-Za-z0-9_-]{8,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # docs 文档站入口 HTML 不缓存：其引用的 style.css/i18n.js 靠 ?v=<build-id>
    # 打戳做版本化，HTML 必须及时回源才能拿到新戳
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # docs 文档站静态资源（style.css / i18n.js，URL 带 ?v=<build-id> 打戳）
    location ~* /docs/.+\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # WAV 素材、图标等静态资源：带 build id 查询串后可长期缓存
    location ~* \.(wav|ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 其余静态文件（不带 hash 的字体、json 等）短期缓存
    location ~* \.(json|woff2?|ttf|otf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 默认 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
