name: MultiChannelAudioSender
options:
  bundleIdPrefix: com.agora
targets:
  MultiChannelAudioSender:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MultiChannelAudioSender
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agora.MultiChannelAudioSender
        PRODUCT_NAME: MultiChannelAudioSender
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "12.0"
