<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" role="img" aria-labelledby="t">
  <title id="t">Three receive paths for a multi-channel stream</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6069"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Lane 1: per-user decoded PCM -->
    <rect x="24" y="14" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="38" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">Per-user decoded</text>
    <text x="94" y="54" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">PCM callback</text>
    <text x="94" y="70" font-size="10" fill="#5a6069" text-anchor="middle">full N-channel data</text>
    <line x1="164" y1="46" x2="186" y2="46" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="14" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="38" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">onPlaybackAudioFrame</text>
    <text x="312" y="54" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">BeforeMixing()</text>
    <text x="312" y="70" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">+ setParameters(N, 48000)</text>
    <text x="462" y="32" font-size="10.5" fill="#5a6069">decoded 16-bit interleaved · 10 ms frames</text>
    <text x="462" y="49" font-size="10.5" fill="#5a6069">callback channel count must match sender</text>
    <text x="462" y="66" font-size="10.5" fill="#5a6069">dump to file or post-process per user</text>

    <!-- Lane 2: encoded frames -->
    <rect x="24" y="90" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="114" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">Encoded frames</text>
    <text x="94" y="132" font-size="10" fill="#5a6069" text-anchor="middle">no decode · no playback</text>
    <line x1="164" y1="122" x2="186" y2="122" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="90" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="114" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">audioRecvEncodedFrame()</text>
    <text x="312" y="134" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">onEncodedAudioFrameReceived()</text>
    <text x="462" y="108" font-size="10.5" fill="#5a6069">OPUSMC frames as received — forward or</text>
    <text x="462" y="125" font-size="10.5" fill="#5a6069">custom-decode off-device</text>
    <text x="462" y="142" font-size="10.5" fill="#5a6069">requires enableAudioRecordingOrPlayout = false</text>

    <!-- Lane 3: mixed output -->
    <rect x="24" y="166" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="192" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">Mixed output</text>
    <text x="94" y="210" font-size="10" fill="#5a6069" text-anchor="middle">device mixer</text>
    <line x1="164" y1="198" x2="186" y2="198" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="166" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="192" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">onPlaybackAudioFrame()</text>
    <text x="312" y="212" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">onMixedAudioFrame()</text>
    <text x="462" y="184" font-size="10.5" fill="#5a6069">always 2 channels</text>
    <text x="462" y="201" font-size="10.5" fill="#5a6069">odd channels → left · even channels → right</text>
    <text x="462" y="218" font-size="10.5" fill="#5a6069">no direct N-channel playback</text>

    <!-- collector -->
    <line x1="856" y1="46" x2="866" y2="46" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="856" y1="122" x2="866" y2="122" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="856" y1="198" x2="866" y2="198" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="866" y1="46" x2="866" y2="268" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="866" y1="268" x2="858" y2="268" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- bottom band -->
    <rect x="24" y="246" width="832" height="48" rx="8" fill="#165dff"/>
    <text x="440" y="268" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">OPUSMC stream from SD-RTN → per-user decode / encoded-frame tap / mixer</text>
    <text x="440" y="287" font-size="10.5" fill="#cfe0ff" text-anchor="middle">the encoded-frame path is exclusive with playback · mixed output is always stereo</text>
  </g>
</svg>
