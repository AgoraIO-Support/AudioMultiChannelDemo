<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" role="img" aria-labelledby="t">
  <title id="t">The three selectChannels modes: surround, stereo, mono</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#165dff"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- ============ Panel 1: surround ============ -->
    <rect x="24" y="20" width="272" height="282" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="40" y="36" width="8" height="8" rx="2" fill="#165dff"/>
    <text x="56" y="44" font-size="13" font-weight="700" fill="#1f2329">"surround"</text>
    <text x="40" y="66" font-size="10" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069">default mode</text>

    <g font-size="10" font-weight="600" text-anchor="middle">
      <rect x="40" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="53" y="109" fill="#1f2329">0</text>
      <rect x="70" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="83" y="109" fill="#1f2329">1</text>
      <rect x="100" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="113" y="109" fill="#ffffff">2</text>
      <rect x="130" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="143" y="109" fill="#ffffff">3</text>
      <rect x="160" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="173" y="109" fill="#1f2329">4</text>
      <rect x="190" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="203" y="109" fill="#1f2329">5</text>
      <rect x="220" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="233" y="109" fill="#1f2329">6</text>
      <rect x="250" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="263" y="109" fill="#1f2329">7</text>
    </g>
    <text x="40" y="136" font-size="9.5" fill="#5a6069">selected: [2, 3]</text>

    <line x1="160" y1="146" x2="160" y2="164" stroke="#165dff" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="48" y="168" width="224" height="44" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="160" y="186" font-size="10.5" font-weight="600" fill="#1f2329" text-anchor="middle">selected channels follow the</text>
    <text x="160" y="202" font-size="10.5" font-weight="600" fill="#1f2329" text-anchor="middle">standard multi-channel protocol</text>

    <text x="160" y="240" font-size="10" fill="#5a6069" text-anchor="middle">output layout = negotiated layout</text>
    <text x="160" y="258" font-size="10" fill="#5a6069" text-anchor="middle">e.g. 5.1: select [2,3] → center + LFE</text>
    <text x="160" y="276" font-size="10" fill="#5a6069" text-anchor="middle">played back as stereo</text>

    <!-- ============ Panel 2: stereo ============ -->
    <rect x="304" y="20" width="272" height="282" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="320" y="36" width="8" height="8" rx="2" fill="#165dff"/>
    <text x="336" y="44" font-size="13" font-weight="700" fill="#1f2329">"stereo"</text>
    <text x="320" y="66" font-size="10" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069">even → left · odd → right</text>

    <g font-size="10" font-weight="600" text-anchor="middle">
      <rect x="320" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="333" y="109" fill="#ffffff">0</text>
      <rect x="350" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="363" y="109" fill="#ffffff">1</text>
      <rect x="380" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="393" y="109" fill="#ffffff">2</text>
      <rect x="410" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="423" y="109" fill="#ffffff">3</text>
      <rect x="440" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="453" y="109" fill="#1f2329">4</text>
      <rect x="470" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="483" y="109" fill="#1f2329">5</text>
      <rect x="500" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="513" y="109" fill="#1f2329">6</text>
      <rect x="530" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="543" y="109" fill="#1f2329">7</text>
    </g>
    <text x="320" y="136" font-size="9.5" fill="#5a6069">selected: [0, 1, 2, 3]</text>

    <path d="M333,120 C333,140 364,148 372,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M393,120 C393,140 384,148 378,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M453,120 C453,142 388,150 384,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)" opacity="0.45"/>
    <path d="M513,120 C513,144 392,152 390,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)" opacity="0.45"/>
    <path d="M363,120 C363,138 442,148 444,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M423,120 C423,138 452,148 450,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M483,120 C483,142 458,150 456,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)" opacity="0.45"/>
    <path d="M543,120 C543,144 464,152 460,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)" opacity="0.45"/>

    <rect x="340" y="168" width="72" height="40" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="376" y="186" font-size="12" font-weight="700" fill="#165dff" text-anchor="middle">Left</text>
    <text x="376" y="200" font-size="9" fill="#5a6069" text-anchor="middle">ch 0, 2, 4, 6</text>
    <rect x="468" y="168" width="72" height="40" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="504" y="186" font-size="12" font-weight="700" fill="#165dff" text-anchor="middle">Right</text>
    <text x="504" y="200" font-size="9" fill="#5a6069" text-anchor="middle">ch 1, 3, 5, 7</text>

    <text x="440" y="232" font-size="10" fill="#5a6069" text-anchor="middle">even indexes (0,2,4,6) → Left</text>
    <text x="440" y="248" font-size="10" fill="#5a6069" text-anchor="middle">odd indexes (1,3,5,7) → Right</text>
    <text x="440" y="272" font-size="10" fill="#5a6069" text-anchor="middle">e.g. select [0,1,2,3] → 0,2 left · 1,3 right</text>

    <!-- ============ Panel 3: mono ============ -->
    <rect x="584" y="20" width="272" height="282" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="600" y="36" width="8" height="8" rx="2" fill="#165dff"/>
    <text x="616" y="44" font-size="13" font-weight="700" fill="#1f2329">"mono"</text>
    <text x="600" y="66" font-size="10" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069">all selected → one channel</text>

    <g font-size="10" font-weight="600" text-anchor="middle">
      <rect x="600" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="613" y="109" fill="#1f2329">0</text>
      <rect x="630" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="643" y="109" fill="#ffffff">1</text>
      <rect x="660" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="673" y="109" fill="#1f2329">2</text>
      <rect x="690" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="703" y="109" fill="#1f2329">3</text>
      <rect x="720" y="92" width="26" height="26" rx="5" fill="#165dff"/><text x="733" y="109" fill="#ffffff">4</text>
      <rect x="750" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="763" y="109" fill="#1f2329">5</text>
      <rect x="780" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="793" y="109" fill="#1f2329">6</text>
      <rect x="810" y="92" width="26" height="26" rx="5" fill="#f3f4f6" stroke="#d6dae0"/><text x="823" y="109" fill="#1f2329">7</text>
    </g>
    <text x="600" y="136" font-size="9.5" fill="#5a6069">selected: [1, 4]</text>

    <path d="M643,120 C643,142 700,148 712,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M733,120 C733,142 736,148 728,164" fill="none" stroke="#165dff" stroke-width="1.3" marker-end="url(#arr)"/>

    <rect x="662" y="168" width="116" height="40" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="720" y="186" font-size="12" font-weight="700" fill="#165dff" text-anchor="middle">Mono mix</text>
    <text x="720" y="200" font-size="9" fill="#5a6069" text-anchor="middle">stereo container</text>

    <text x="720" y="240" font-size="10" fill="#5a6069" text-anchor="middle">all selected channels summed</text>
    <text x="720" y="258" font-size="10" fill="#5a6069" text-anchor="middle">selectChannels([3], "mono")</text>
    <text x="720" y="276" font-size="10" fill="#5a6069" text-anchor="middle">→ listen to a single channel</text>
  </g>
</svg>
