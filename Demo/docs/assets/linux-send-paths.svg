<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" role="img" aria-labelledby="t">
  <title id="t">Three send paths converging on one custom audio track</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6069"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Lane 1: Raw PCM -->
    <rect x="24" y="14" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="40" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">Raw PCM</text>
    <text x="94" y="58" font-size="10" fill="#5a6069" text-anchor="middle">in-memory buffer</text>
    <line x1="164" y1="46" x2="186" y2="46" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="14" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="40" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">IAudioPcmDataSender::</text>
    <text x="312" y="60" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">sendAudioPcmData()</text>
    <text x="462" y="32" font-size="10.5" fill="#5a6069">3–8 ch · 48 kHz · 16-bit signed LE</text>
    <text x="462" y="49" font-size="10.5" fill="#5a6069">sample-interleaved · 10 ms per frame</text>
    <text x="462" y="66" font-size="10.5" fill="#5a6069">samplesPerChannel = 480 (10 ms @ 48 kHz)</text>

    <!-- Lane 2: WAV file -->
    <rect x="24" y="90" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="116" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">WAV file</text>
    <text x="94" y="134" font-size="10" fill="#5a6069" text-anchor="middle">read from disk</text>
    <line x1="164" y1="122" x2="186" y2="122" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="90" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="116" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">parse RIFF header</text>
    <text x="312" y="136" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">then sendAudioPcmData()</text>
    <text x="462" y="108" font-size="10.5" fill="#5a6069">16-bit → sent directly</text>
    <text x="462" y="125" font-size="10.5" fill="#5a6069">24-bit → convert per sample (&gt;&gt; 8)</text>
    <text x="462" y="142" font-size="10.5" fill="#5a6069">other bit depths rejected · must be 48 kHz</text>

    <!-- Lane 3: Pre-encoded Opus -->
    <rect x="24" y="166" width="140" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="94" y="190" font-size="11.5" font-weight="600" fill="#1f2329" text-anchor="middle">Pre-encoded Opus</text>
    <text x="94" y="208" font-size="10" fill="#5a6069" text-anchor="middle">raw frame stream</text>
    <line x1="164" y1="198" x2="186" y2="198" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="188" y="166" width="248" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="312" y="192" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">IAudioEncodedFrameSender::</text>
    <text x="312" y="212" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2329" text-anchor="middle">sendEncodedAudioFrame()</text>
    <text x="462" y="184" font-size="10.5" fill="#5a6069">8 ch · 48 kHz raw Opus frames (not ogg)</text>
    <text x="462" y="201" font-size="10.5" fill="#5a6069">fixed 640 bytes per 20 ms frame</text>
    <text x="462" y="218" font-size="10.5" fill="#5a6069">track created with MIX_DISABLED</text>

    <!-- collector -->
    <line x1="856" y1="46" x2="866" y2="46" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="856" y1="122" x2="866" y2="122" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="856" y1="198" x2="866" y2="198" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="866" y1="46" x2="866" y2="268" stroke="#5a6069" stroke-width="1.2"/>
    <line x1="866" y1="268" x2="858" y2="268" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- bottom band -->
    <rect x="24" y="246" width="832" height="48" rx="8" fill="#165dff"/>
    <text x="440" y="268" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">custom audio track → OPUSMC encode → publish → SD-RTN</text>
    <text x="440" y="287" font-size="10.5" fill="#cfe0ff" text-anchor="middle">PCM path and encoded path are mutually exclusive on the same track · custom send paths bypass 3A processing</text>
  </g>
</svg>
