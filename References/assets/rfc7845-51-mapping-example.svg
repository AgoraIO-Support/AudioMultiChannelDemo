<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="t">
  <title id="t">RFC 7845 channel mapping walkthrough: how 5.1 channel_mapping=0,4,1,2,3,5 reorders decoded channels into Vorbis order</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- streams -->
    <text x="24" y="18" font-size="11" font-weight="600" fill="#1f2329">Coded streams (num_streams=4, coupled_streams=2)</text>
    <rect x="24" y="28" width="200" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="124" y="50" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">stream 0 (stereo)</text>
    <text x="124" y="68" font-size="10.5" fill="#5a6069" text-anchor="middle">decoded 0 = FL · 1 = FR</text>
    <text x="124" y="84" font-size="10" fill="#5a6069" text-anchor="middle">indices &lt; 2M: even=L, odd=R</text>
    <rect x="240" y="28" width="200" height="64" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="340" y="50" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">stream 1 (stereo)</text>
    <text x="340" y="68" font-size="10.5" fill="#5a6069" text-anchor="middle">decoded 2 = RL · 3 = RR</text>
    <text x="340" y="84" font-size="10" fill="#5a6069" text-anchor="middle">indices &lt; 2M: even=L, odd=R</text>
    <rect x="456" y="28" width="200" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="556" y="50" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">stream 2 (mono)</text>
    <text x="556" y="68" font-size="10.5" fill="#5a6069" text-anchor="middle">decoded 4 = FC</text>
    <text x="556" y="84" font-size="10" fill="#5a6069" text-anchor="middle">index ≥ 2M: stream index−M</text>
    <rect x="672" y="28" width="184" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="764" y="50" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">stream 3 (mono)</text>
    <text x="764" y="68" font-size="10.5" fill="#5a6069" text-anchor="middle">decoded 5 = LFE</text>
    <text x="764" y="84" font-size="10" fill="#5a6069" text-anchor="middle">index ≥ 2M: stream index−M</text>

    <!-- mapping table -->
    <rect x="24" y="112" width="832" height="46" rx="8" fill="#165dff"/>
    <text x="440" y="131" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">channel_mapping = 0,4,1,2,3,5 — one index per output channel</text>
    <text x="440" y="149" font-size="10.5" fill="#cfe0ff" text-anchor="middle">SDP: a=fmtp:96 num_streams=4;coupled_streams=2;channel_mapping=0,4,1,2,3,5</text>

    <!-- outputs -->
    <text x="24" y="188" font-size="11" font-weight="600" fill="#1f2329">Output channels — Vorbis order (channel mapping family 1)</text>
    <rect x="24" y="198" width="126" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="87" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 0 ← 0</text>
    <text x="87" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">FL</text>
    <rect x="166" y="198" width="126" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="229" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 1 ← 4</text>
    <text x="229" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">FC</text>
    <rect x="308" y="198" width="126" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="371" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 2 ← 1</text>
    <text x="371" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">FR</text>
    <rect x="450" y="198" width="126" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="513" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 3 ← 2</text>
    <text x="513" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">RL</text>
    <rect x="592" y="198" width="126" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="655" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 4 ← 3</text>
    <text x="655" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">RR</text>
    <rect x="734" y="198" width="122" height="64" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="795" y="222" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5a6069" text-anchor="middle">out 5 ← 5</text>
    <text x="795" y="244" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">LFE</text>

    <!-- rules band -->
    <rect x="24" y="286" width="832" height="62" rx="8" fill="#f4f6f9"/>
    <text x="40" y="308" font-size="10.5" fill="#1f2329">Index rules (RFC 7845 §5.1.1):  index &lt; 2M → stream index/2 as stereo, even = left, odd = right  ·  2M ≤ index &lt; 255 → stream index−M as mono  ·  255 = pure silence</text>
    <text x="40" y="330" font-size="10.5" fill="#ad6800">Caution: Vorbis order (FL,FC,FR,RL,RR,LFE) ≠ WAVE order (FL,FR,FC,LFE,RL,RR) — permute channels when converting to/from WAV</text>
  </g>
</svg>
