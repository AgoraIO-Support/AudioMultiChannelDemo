<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t">
  <title id="t">Multi-channel Opus (multiopus) multistream encoding: every two channels form one coupled stream</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6069"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- input -->
    <rect x="24" y="105" width="160" height="110" rx="8" fill="#eaf1ff" stroke="#165dff"/>
    <text x="104" y="132" font-size="12" font-weight="600" fill="#1f2329" text-anchor="middle">Input channels</text>
    <text x="104" y="152" font-size="10.5" fill="#1f2329" text-anchor="middle">3–8 channels</text>
    <text x="104" y="170" font-size="10.5" fill="#1f2329" text-anchor="middle">48 kHz PCM only</text>
    <text x="104" y="188" font-size="10.5" fill="#5a6069" text-anchor="middle">sample-interleaved</text>
    <line x1="184" y1="160" x2="206" y2="160" stroke="#5a6069" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- encoder instances -->
    <rect x="208" y="14" width="300" height="60" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="358" y="38" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">Opus encoder instance #1</text>
    <text x="358" y="56" font-size="10.5" fill="#5a6069" text-anchor="middle">coupled stream: CH1 + CH2</text>
    <rect x="208" y="84" width="300" height="60" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="358" y="108" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">Opus encoder instance #2</text>
    <text x="358" y="126" font-size="10.5" fill="#5a6069" text-anchor="middle">coupled stream: CH3 + CH4</text>
    <rect x="208" y="154" width="300" height="60" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="358" y="178" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">Opus encoder instance #3</text>
    <text x="358" y="196" font-size="10.5" fill="#5a6069" text-anchor="middle">coupled stream: CH5 + CH6</text>
    <rect x="208" y="224" width="300" height="60" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="358" y="248" font-size="11" font-weight="600" fill="#1f2329" text-anchor="middle">Opus encoder instance #4</text>
    <text x="358" y="266" font-size="10.5" fill="#5a6069" text-anchor="middle">coupled stream: CH7 + CH8</text>

    <!-- arrows to output -->
    <line x1="508" y1="44" x2="686" y2="148" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="508" y1="114" x2="686" y2="156" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="508" y1="184" x2="686" y2="164" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="508" y1="254" x2="686" y2="172" stroke="#5a6069" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- output -->
    <rect x="688" y="105" width="168" height="110" rx="8" fill="#165dff"/>
    <text x="772" y="132" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">One RTC stream</text>
    <text x="772" y="152" font-size="10.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#cfe0ff" text-anchor="middle">multiopus/48000/N</text>
    <text x="772" y="170" font-size="10.5" fill="#cfe0ff" text-anchor="middle">Agora PT 123 / 124 / 125</text>
    <text x="772" y="188" font-size="10.5" fill="#cfe0ff" text-anchor="middle">over SD-RTN</text>

    <!-- notes -->
    <text x="24" y="310" font-size="10.5" fill="#5a6069">8ch example: 4 coupled streams (num_streams=4, coupled_streams=4)  ·  5.1: 2 coupled + 2 mono (num_streams=4, coupled_streams=2)</text>
    <text x="24" y="330" font-size="10.5" fill="#5a6069">Odd channel count: the leftover channel forms a mono stream  ·  <tspan fill="#ad6800">Default bitrate scales: ~32 kbps × channels</tspan></text>

    <!-- bottom band -->
    <rect x="24" y="346" width="832" height="24" rx="6" fill="#f4f6f9"/>
    <text x="440" y="362" font-size="10.5" fill="#5a6069" text-anchor="middle">SDP fmtp: num_streams / coupled_streams / channel_mapping — semantics reused from RFC 7845 §5.1.1 (channel mapping family 1)</text>
  </g>
</svg>
